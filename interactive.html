<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="พื้นที่ทดลอง 3D ของ Phakin Meksuwan (BossZY): galaxy, physics playground และ project gallery">
  <meta name="theme-color" content="#0b0c0b">
  <title>Phakin Meksuwan (BossZY) — 3D Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b0c0b;
      --paper: #e8e5dc;
      --paper-dim: #96988f;
      --line: rgba(232, 229, 220, .18);
      --signal: #b8ed3b;
      --rust: #f06437;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: "IBM Plex Sans Thai", sans-serif; }
    button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
    #three-container { position: fixed; z-index: 1; inset: 0; }
    #three-container canvas { display: block; }
    .grain { position: fixed; z-index: 2; inset: 0; pointer-events: none; opacity: .055; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .interactive-ui { position: fixed; z-index: 10; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 24px 28px; pointer-events: none; }
    .clickable { pointer-events: auto; }
    .space-nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .back-btn { display: inline-flex; align-items: center; gap: 14px; color: var(--paper); text-decoration: none; font: 500 10px/1 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }
    .back-btn i { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--line); font-style: normal; transition: transform .25s var(--ease), background .25s; }
    .back-btn:hover i { color: var(--ink); background: var(--signal); transform: translateX(-4px); }
    .space-title-badge { display: flex; align-items: center; gap: 12px; color: var(--paper-dim); font: 400 9px/1 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .14em; }
    .space-title-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 4px rgba(184,237,59,.1); }
    .space-intro { position: absolute; top: 18%; left: 28px; width: min(420px, 42vw); }
    .space-intro span { color: var(--rust); font: 500 9px/1 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .14em; }
    .space-intro h1 { margin: 18px 0; font-size: clamp(46px, 6.2vw, 92px); font-weight: 500; line-height: .88; letter-spacing: -.065em; }
    .space-intro p { max-width: 360px; margin: 0; color: var(--paper-dim); font-size: 14px; }
    .readout { position: absolute; top: 18%; right: 28px; display: grid; grid-template-columns: auto auto; gap: 9px 24px; color: var(--paper-dim); font: 400 8px/1 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }
    .readout b { color: var(--paper); font-weight: 500; text-align: right; }
    .controls-panel { align-self: center; width: min(760px, calc(100vw - 56px)); padding: 12px; border: 1px solid var(--line); background: rgba(11,12,11,.78); backdrop-filter: blur(16px); }
    .mode-selector { display: grid; grid-template-columns: repeat(3, 1fr); }
    .mode-btn { min-height: 48px; padding: 10px 14px; color: var(--paper-dim); background: transparent; border: 0; border-right: 1px solid var(--line); cursor: pointer; font: 500 9px/1.3 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .08em; transition: color .2s, background .2s; }
    .mode-btn:last-child { border-right: 0; }
    .mode-btn span { color: #5d6057; margin-right: 8px; }
    .mode-btn:hover { color: var(--paper); }
    .mode-btn.active { color: var(--ink); background: var(--signal); }
    .mode-btn.active span { color: rgba(11,12,11,.55); }
    .action-row { display: flex; gap: 7px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .action-btn { flex: 1; min-height: 40px; color: var(--paper); background: transparent; border: 1px solid var(--line); cursor: pointer; font: 500 8px/1 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .08em; }
    .action-btn.primary { color: var(--ink); background: var(--paper); }
    .space-hint { margin-top: 10px; color: var(--paper-dim); text-align: center; font: 400 8px/1.5 "IBM Plex Mono", monospace; }
    @media (max-width: 720px) {
      .interactive-ui { padding: 16px; }
      .space-title-badge { font-size: 7px; }
      .space-intro { top: 13%; left: 16px; width: calc(100vw - 32px); }
      .space-intro h1 { font-size: 52px; }
      .space-intro p { width: 80%; }
      .readout { display: none; }
      .controls-panel { width: 100%; }
      .mode-btn { padding: 8px 4px; font-size: 7px; }
      .mode-btn span { display: block; margin: 0 0 5px; }
      .space-hint { min-height: 25px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="three-container" aria-label="พื้นที่แสดงผลสามมิติ"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="interactive-ui">
    <div class="space-nav">
      <a href="index.html" class="back-btn clickable"><i>←</i> Portfolio</a>
      <div class="space-title-badge"><i></i> BZ LAB / 3D PLAYGROUND</div>
    </div>

    <div class="space-intro">
      <span>EXPERIMENT NO. 03</span>
      <h1>เล่นกับ<br>พื้นที่ว่าง.</h1>
      <p>พื้นที่ทดลองที่ไม่ได้พยายามเป็นของมีประโยชน์ทุกชิ้น ลองขยับเมาส์ เปลี่ยนโหมด แล้วดูว่าเกิดอะไรขึ้น</p>
    </div>
    <div class="readout" aria-hidden="true"><span>RENDERER</span><b>THREE.JS</b><span>INPUT</span><b>POINTER / TOUCH</b><span>STATUS</span><b id="mode-readout">GALAXY</b></div>

    <div class="controls-panel clickable">
      <div class="mode-selector" role="group" aria-label="เลือกโหมด 3D">
        <button class="mode-btn active" id="btn-galaxy" type="button" onclick="switchMode('galaxy')"><span>01</span> Particle field</button>
        <button class="mode-btn" id="btn-physics" type="button" onclick="switchMode('physics')"><span>02</span> Physics table</button>
        <button class="mode-btn" id="btn-gallery" type="button" onclick="switchMode('gallery')"><span>03</span> Project orbit</button>
      </div>
      <div class="action-row" id="physics-actions" style="display: none;">
        <button class="action-btn primary" type="button" onclick="spawnShape()">Add object</button>
        <button class="action-btn" type="button" onclick="clearShapes()">Clear table</button>
      </div>
      <div class="space-hint" id="mode-instructions">ขยับเมาส์เพื่อเปลี่ยนมุมมองของกลุ่มอนุภาค</div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/interactive.js?v=20260920"></script>
</body>
</html>
